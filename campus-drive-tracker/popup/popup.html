<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Drive Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo-area">
        <svg class="logo-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="24" height="24" rx="6" fill="url(#logoGrad)"/>
          <path d="M7 19V7H17V19H7Z" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M10 10H14" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M10 14H14" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M12 3V5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
              <stop stop-color="#6366F1"/>
              <stop offset="1" stop-color="#4F46E5"/>
            </linearGradient>
          </defs>
        </svg>
        <h1>DriveTracker</h1>
      </div>
      <button id="viewDashboardBtn" class="icon-btn" title="View Dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="9" rx="1" />
          <rect x="14" y="3" width="7" height="5" rx="1" />
          <rect x="14" y="12" width="7" height="9" rx="1" />
          <rect x="3" y="16" width="7" height="5" rx="1" />
        </svg>
      </button>
    </header>

    <!-- Main Section -->
    <main class="popup-main">
      <!-- Status Notice Card -->
      <div id="statusNotice" class="status-card info">
        <div class="status-icon-wrapper">
          <svg class="spinner" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
            <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"></path>
          </svg>
          <svg class="static-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
        </div>
        <span id="statusMessage">Open a Gmail placement email to begin.</span>
      </div>

      <!-- Quick Action Area -->
      <div class="extraction-action">
        <button id="extractBtn" class="btn primary-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          <span>Extract Drive Details</span>
        </button>
      </div>

      <!-- Review Form -->
      <form id="driveForm" class="review-form hidden">
        <div class="form-title-row">
          <h3>Verify Extracted Data</h3>
          <span class="badge">Review</span>
        </div>

        <div class="form-group">
          <label for="company">Company Name <span class="required">*</span></label>
          <input type="text" id="company" required placeholder="e.g. Google">
        </div>

        <div class="form-group">
          <label for="role">Job Role(s) <span class="required">*</span></label>
          <input type="text" id="role" required placeholder="e.g. Software Engineer Intern">
        </div>

        <div class="form-group-row">
          <div class="form-group">
            <label for="deadline">Registration Deadline <span class="required">*</span></label>
            <input type="datetime-local" id="deadline" required>
          </div>
        </div>

        <div class="form-group">
          <label for="registrationLink">Registration Link</label>
          <input type="url" id="registrationLink" placeholder="https://forms.gle/...">
        </div>

        <div class="form-group-row">
          <div class="form-group">
            <label for="eligibility">Eligibility</label>
            <input type="text" id="eligibility" placeholder="e.g. B.Tech CSE/IT">
          </div>
          <div class="form-group">
            <label for="ctc">CTC / Stipend</label>
            <input type="text" id="ctc" placeholder="e.g. 12 LPA / 50k pm">
          </div>
        </div>

        <!-- Save Button -->
        <button type="submit" id="saveBtn" class="btn success-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          <span>Save Campus Drive</span>
        </button>
      </form>
    </main>

    <!-- Footer -->
    <footer class="popup-footer">
      <span class="version-label">v1.0.0</span>
      <span>Local Smart Alerts Active</span>
    </footer>
  </div>

  <!-- Script Modules -->
  <script type="module" src="popup.js"></script>
</body>
</html>
